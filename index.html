<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 D-day</title>
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 D-day">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 모바일 앱 한 화면. 상단 고정 바 → 요약 3칸 → 추가 카드 → 필터 → 상태별로 묶인 목록 → 이번 달 기록 */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --ink: #111820;
  --ink-2: #3d4854;
  --muted: #6b7684;
  --line: #e3e7ec;
  --accent: #2f5bea;
  --accent-soft: #e8eefe;
  --accent-ink: #ffffff;
  --ok: #138a52;  --ok-soft: #e3f5eb;
  --warn: #c2650a; --warn-soft: #fdf0e1;
  --bad: #d93025; --bad-soft: #fde8e6;
  --shadow: 0 1px 2px rgba(17,24,32,.04), 0 4px 16px rgba(17,24,32,.05);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1318; --surface: #181d24; --surface-2: #1f252d; --ink: #eef1f4; --ink-2: #c3cad2; --muted: #8f99a5; --line: #2a313a;
    --accent: #7c9bff; --accent-soft: #1d2747; --accent-ink: #0c1330;
    --ok: #4fd18d; --ok-soft: #14301f; --warn: #f2a54a; --warn-soft: #362712; --bad: #ff7a70; --bad-soft: #3a1b18;
    --shadow: none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }

/* 상단 바 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-in { max-width: 680px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: clamp(34px, 10vw, 44px); height: clamp(34px, 10vw, 44px); flex: none; display: block; }
.wordmark { display: grid; min-width: 0; }
.wordmark small { font-size: 23px; color: var(--ink-2); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; white-space: nowrap; }
.brand h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.15; display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.brand h1 { width: max-content; }
.brand h1 .home { color: var(--ink); }
.brand h1 .dday-mark { color: var(--accent); display: inline-flex; align-items: baseline; }
.brand h1 .dday-mark .dash { display: inline-block; width: 9px; height: 4px; border-radius: 2px; background: var(--bad); margin: 0 2px; transform: translateY(-7px); }
.foot { display: grid; justify-items: center; gap: 10px; text-align: center; font-size: 14px; color: var(--muted); padding-top: 8px; }
.foot .me { font-size: 15px; gap: 8px; }
.foot .me .avatar { width: 28px; height: 28px; font-size: 13px; }
.foot .me .textbtn { font-size: 15px; }
.me { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
.me .avatar { width: 22px; height: 22px; font-size: 11px; }
.me-name { font-weight: 700; color: var(--ink-2); }
.me .textbtn { font-size: 13px; padding: 2px 2px 2px 4px; text-decoration: underline; text-underline-offset: 2px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 16px; }
.textbtn { background: none; border: 0; color: var(--muted); font-size: 15px; font-weight: 600; padding: 8px 4px; cursor: pointer; }

main { max-width: 680px; margin: 0 auto; padding-block: 8px 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); }
@media (prefers-color-scheme: light) { .card { border-color: transparent; } }
h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }

/* 요약 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 2px solid transparent; border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 14px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.stat .lbl { white-space: nowrap; font-size: 15px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.stat .lbl i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.stat b { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -0.03em; }
.stat b span { font-size: 17px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.stat.bad i { background: var(--bad); } .stat.bad b { color: var(--bad); }
.stat.warn i { background: var(--warn); } .stat.warn b { color: var(--warn); }
.stat.ok i { background: var(--ok); } .stat.ok b { color: var(--ink); }
.stat[aria-pressed="true"] { border-color: var(--ink); }

/* 로그인 */
.login { padding: 24px 20px; display: grid; gap: 18px; }
.login p { margin: 0; color: var(--muted); font-size: 15px; }
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person { border: 2px solid var(--line); background: var(--surface-2); border-radius: 16px; padding: 18px 12px; cursor: pointer; display: grid; justify-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
.person .avatar { width: 52px; height: 52px; font-size: 22px; }
.person[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* 입력 */
.add { display: grid; gap: 18px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field > span { font-size: 15px; font-weight: 700; color: var(--ink-2); }
input[type="text"], input[type="password"], input[type="date"] {
  font: inherit; font-size: 18px; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; height: 54px; padding: 0 16px; width: 100%; min-width: 0; appearance: none; -webkit-appearance: none;
}
input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
input::placeholder { color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; height: 54px; }
.seg button { border: 0; background: none; border-radius: 10px; font-size: 17px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.stepper { display: flex; align-items: center; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; height: 54px; }
.stepper button { width: 48px; height: 100%; border: 0; background: none; font-size: 24px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.stepper output { min-width: 32px; text-align: center; font-size: 19px; font-weight: 700; }
.datebox { display: grid; gap: 10px; }
.when { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.when strong { font-size: 19px; font-weight: 800; }
.when em { font-style: normal; font-size: 16px; font-weight: 700; color: var(--accent); }
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
#quickStored { grid-template-columns: repeat(4, 1fr); }
.qbtn { white-space: nowrap; padding: 0; height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700; cursor: pointer; color: var(--ink); }
.qbtn:active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qrow span { font-size: 14px; color: var(--muted); }
.reset { background: none; border: 0; color: var(--accent); font-size: 15px; font-weight: 700; cursor: pointer; padding: 6px 2px; }
.primary { height: 56px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 18px; font-weight: 800; cursor: pointer; width: 100%; }
.primary:active { filter: brightness(.94); }
.err { margin: 0; color: var(--bad); font-size: 15px; font-weight: 600; }

/* 섹션 전환 */
.sections { display: grid; grid-template-columns: repeat(3, auto); background: var(--surface); border-radius: 14px; padding: 4px; gap: 3px; box-shadow: var(--shadow); border: 1px solid var(--line); }
@media (prefers-color-scheme: light) { .sections { border-color: transparent; } }
.sections button { height: 42px; padding: 0 9px; border: 0; border-radius: 10px; background: none; font-size: 15px; font-weight: 800; white-space: nowrap; color: var(--muted); cursor: pointer; }
@media (max-width: 400px) { .sections button { padding: 0 7px; font-size: 14px; height: 40px; } .sections { padding: 3px; gap: 2px; } }
.sections button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.legend em { font-style: normal; }
.hint { font-size: 14px; color: var(--muted); font-weight: 500; }
.two-seg button { font-size: 16px; }

/* 팝업 */
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(8,12,18,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 86vh; border-radius: 24px 24px 0 0; display: grid; grid-template-rows: auto 1fr; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); position: relative; }
.sheet-h::before { content: ""; position: absolute; top: 7px; left: 50%; width: 40px; height: 5px; border-radius: 3px; background: var(--line); transform: translateX(-50%); }
.sheet-h h2 { display: flex; align-items: center; gap: 8px; }
.sheet-h h2 i { width: 10px; height: 10px; border-radius: 50%; }
.sheet-h h2.bad i { background: var(--bad); } .sheet-h h2.warn i { background: var(--warn); } .sheet-h h2.ok i { background: var(--ok); }
.sheet-close { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 22px; cursor: pointer; color: var(--ink-2); }
.sheet-body { overflow-y: auto; padding: 4px 20px 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; align-content: start; overscroll-behavior: contain; }
.sheet-sub { margin: -6px 0 4px; font-size: 15px; color: var(--muted); }
@media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 24px; max-height: 80vh; } }
@media (prefers-reduced-motion: no-preference) {
  .sheet-back:not([hidden]) { animation: fade .18s ease-out; }
  .sheet-back:not([hidden]) .sheet { animation: rise .24s cubic-bezier(.2,.8,.2,1); }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: .6; } }
body.locked { overflow: hidden; }
.stat:active { transform: scale(.98); }

/* 요약 팝업: 화면 가운데보다 살짝 위 */
#sheetBack { align-items: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 11vh) 16px 16px; }
#sheetBack .sheet { border-radius: 24px; max-height: 72vh; padding-bottom: 0; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
#sheetBack .sheet-h::before { display: none; }
#sheetBack .sheet-h { padding-top: 20px; }
@media (prefers-reduced-motion: no-preference) {
  #sheetBack:not([hidden]) .sheet { animation: pop .2s cubic-bezier(.2,.8,.2,1); }
}
@keyframes pop { from { transform: translateY(12px) scale(.97); opacity: 0; } }

/* 추가·수정 시트 */
.form-sheet { grid-template-rows: auto 1fr auto; }
.form-sheet .sheet-body { gap: 18px; }
.sheet-foot { padding: 12px 20px 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--bg); display: grid; gap: 8px; }
.foot-btns { display: flex; gap: 10px; }
.foot-btns .primary { flex: 1; }
.ghostbtn { height: 54px; padding: 0 18px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700; cursor: pointer; color: var(--ink-2); white-space: nowrap; width: 100%; }
.foot-btns .ghostbtn { width: auto; height: 56px; }
.ghostbtn.danger { color: var(--bad); }
.ghostbtn.danger.confirm { background: var(--bad); border-color: var(--bad); color: #fff; }
.two-even { grid-template-columns: 1fr auto; }
.add .two:not(.two-even) { grid-template-columns: 1fr; }
.add .stepper { justify-self: start; }
.seg button { white-space: nowrap; }
.opt { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.add .field > span { display: flex; align-items: baseline; }

/* 추가 버튼 */
.fab { position: fixed; z-index: 40; right: max(20px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); height: 60px; padding: 0 24px 0 20px; border-radius: 30px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 18px; font-weight: 800; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent); cursor: pointer; display: flex; align-items: center; gap: 6px; }
.fab span { font-size: 28px; font-weight: 500; line-height: 1; margin-top: -2px; }
.fab:active { transform: scale(.96); }
@media (min-width: 760px) { .fab { right: calc(50% - 340px); } }

/* 알림 */
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); width: max-content; max-width: calc(100% - 32px); background: #1b222b; color: #f3f5f7; border-radius: 16px; padding: 12px 12px 12px 18px; display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast span { min-width: 0; overflow-wrap: anywhere; }
.toast button { flex: none; background: none; border: 0; color: #9fb4ff; font-size: 16px; font-weight: 800; padding: 6px 8px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .toast:not([hidden]) { animation: drop .2s ease-out; }
@keyframes drop { from { transform: translate(-50%, -16px); opacity: 0; } } }

/* 검색 */
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { font: inherit; font-size: 17px; width: 100%; height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 16px 0 46px; appearance: none; -webkit-appearance: none; }
.search input:focus { outline: none; border-color: var(--accent); }
.memo { font-size: 15px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 6px 10px; margin-top: 2px; overflow-wrap: anywhere; }
.opened { color: var(--accent); font-weight: 600; }
.act.edit { color: var(--ink-2); }
main { padding-bottom: 110px !important; }

/* 필터 */
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(20px, env(safe-area-inset-left, 0px))); padding: 2px max(20px, env(safe-area-inset-left, 0px)); }
.filters::-webkit-scrollbar { display: none; }
.pill { flex: none; height: 42px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pill .n { margin-left: 4px; opacity: .6; }

/* 목록 */
.group { display: grid; gap: 10px; }
.group-h { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; }
.group-h h3 { margin: 0; font-size: 17px; font-weight: 800; }
.group-h span { font-size: 15px; color: var(--muted); font-weight: 600; }
.group-h.bad h3 { color: var(--bad); } .group-h.warn h3 { color: var(--warn); }
.note { margin: 0; padding: 12px 16px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 600; }
.item { padding: 14px 14px 14px 14px; display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; }
.dday { height: 72px; border-radius: 14px; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.dday b { white-space: nowrap; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.dday b.long { font-size: 18px; }
.dday b.xlong { font-size: 15px; }
.dday small { font-size: 13px; font-weight: 700; margin-top: 3px; }
.dday.ok { background: var(--ok-soft); color: var(--ok); }
.dday.warn { background: var(--warn-soft); color: var(--warn); }
.dday.bad { background: var(--bad-soft); color: var(--bad); }
.dday.gray { background: var(--surface-2); color: var(--muted); }
.info { min-width: 0; display: grid; gap: 4px; }
.name { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qty { font-size: 15px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; }
.meta { font-size: 15px; color: var(--muted); font-weight: 500; }
.acts { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.act { height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700; cursor: pointer; padding: 0 14px; }
.act.eat { color: var(--ok); }
.act.toss { color: var(--bad); }
.act.del { color: var(--muted); }
.act.del.confirm { background: var(--bad); border-color: var(--bad); color: #fff; }
.act.undo { color: var(--accent); grid-column: 1 / -1; }
@media (min-width: 560px) and (max-width: 699px) {
  .item { grid-template-columns: 72px 1fr auto; }
  .acts { grid-column: auto; grid-template-columns: auto auto auto; }
  .act.undo { grid-column: auto; }
}
#list { display: grid; gap: 22px; align-items: start; }
.side-panel { display: contents; }
.month { order: 1; }
.foot { order: 2; }

/* ===== 태블릿 세로: 더 넓게, 카드 2열 ===== */
@media (min-width: 700px) {
  .topbar-in { max-width: 980px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  main { max-width: 980px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  .group { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .group-h { grid-column: 1 / -1; }
  .stats { gap: 14px; }
  .stat { padding: 18px 20px 16px; }
  .stat b { font-size: 40px; }
  .filters { margin: 0; padding: 2px 0; flex-wrap: wrap; overflow: visible; }
  .fab { right: max(28px, calc(env(safe-area-inset-right, 0px) + 16px)); }
  .sections button { height: 48px; padding: 0 18px; font-size: 17px; }
  .sections { padding: 5px; gap: 4px; border-radius: 16px; }
  .logo { width: 52px; height: 52px; }
  .item { padding: 16px; }
}

/* ===== 태블릿 가로: 왼쪽 요약 패널 + 오른쪽 상태별 보드 ===== */
@media (min-width: 900px) and (orientation: landscape) {
  .topbar-in, main { max-width: 1440px; }
  main { grid-template-columns: 330px minmax(0, 1fr); column-gap: 28px; align-items: start; }

const DAY = 86400000;

const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

  const bar = document.querySelector(".topbar-in"), logo = document.querySelector(".logo");
  const cs = getComputedStyle(bar);
  const room = bar.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - document.querySelector(".sections").offsetWidth - logo.getBoundingClientRect().width - 10 - 10;
  h.style.fontSize = "26px";
  const hw = h.scrollWidth;
  if (hw > room) h.style.fontSize = Math.max(15, 26 * room / hw).toFixed(1) + "px";
  const range = document.createRange(); range.selectNodeContents(d);
  d.style.fontSize = "23px";
  const w = range.getBoundingClientRect().width, target = h.getBoundingClientRect().width;
  if (w > 0 && target > 0) d.style.fontSize = Math.max(16, Math.min(30, 23 * target / w)).toFixed(1) + "px";

  const recId = newId();
  const batch = writeBatch(db);
  batch.update(doc(itemsCol, x.id), { qty: increment(-1) });
  batch.set(doc(itemsCol, recId), Object.assign({}, body(x), stamp, { sourceId: x.id }));
  batch.commit().catch(fail);
  toast(x.name + " 1개 " + verb + " · " + ((x.qty || 1) - 1) + "개 남음", () => {
    const b = writeBatch(db);
    b.update(doc(itemsCol, x.id), { qty: increment(1) });
    b.delete(doc(itemsCol, recId));
    return b.commit();
  });
}
function removeWithUndo(x) {

  remove(x.id).catch(fail);
  toast(x.name + " 삭제함", () => save(original));
}

let toastTimer = null, toastFn = null;
function toast(msg, undoFn) {

  setVis("toastUndo", !!undoFn);

}
$("toastUndo").addEventListener("click", () => {

});
function undo(x) {
  const src = x.sourceId && items.find((i) => i.id === x.sourceId && i.status === "active");
  if (src) {

    batch.update(doc(itemsCol, src.id), { qty: increment(1) });

function setDate(s) { $("fDate").value = s; showWhen(); }
function showWhen() {
  const v = $("fDate").value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { $("whenDate").textContent = "날짜를 고르세요"; $("whenLeft").textContent = ""; return; }
  const n = daysLeft(v);
  $("whenDate").textContent = fmtShort(v);
  if (mode === "stored") $("whenLeft").textContent = n === 0 ? "오늘 넣음" : n < 0 ? (-n) + "일 전에 넣음" : "아직 오지 않은 날이에요";
  else $("whenLeft").textContent = n === 0 ? "오늘까지" : n > 0 ? n + "일 뒤" : (-n) + "일 지남";
}
function bump(days, months) {
  const cur = /^\d{4}-\d{2}-\d{2}$/.test($("fDate").value) ? parse($("fDate").value) : startOfToday();
  if (months) {
    const day = cur.getDate();
    cur.setDate(1); cur.setMonth(cur.getMonth() + months);
    const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
    cur.setDate(Math.min(day, last));
  } else cur.setDate(cur.getDate() + days);
  setDate(ymd(cur));
}
function setMode(m, byUser) {

  $("modeHint").textContent = stored ? "기한 대신 넣은 지 며칠 됐는지 보여 줘요. 냉동 고기나 반찬처럼 기한이 안 적힌 것에 좋아요." : "";
  setVis("quickExpiry", !stored); setVis("qrow", !stored); setVis("quickStored", stored);
  setDate(addDays(0));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const kdate = (ms) => new Date(ms || 0).toLocaleDateString("ko-KR", { month: "long", day: "numeric" });

function itemCard(x, usingSamples) {
  const S = SECTIONS[catOf(x)];
  const card = el("div", "card item");
  const dd = el("div", "dday");
  const stored = modeOf(x) === "stored";
  if (x.status !== "active") {
    dd.classList.add(x.status === "eaten" ? "ok" : "bad");
    dd.append(el("b", "", x.status === "eaten" ? S.usedPast : "버림"));
  } else if (stored) {
    const d = sinceDays(x.storedOn);
    dd.classList.add("gray");
    const lbl = d <= 0 ? "오늘" : d + "일째";
    dd.append(el("b", lbl.length >= 6 ? "xlong" : lbl.length >= 5 ? "long" : "", lbl), el("small", "", d <= 0 ? "넣음" : "보관 중"));
  } else {
    const n = daysLeft(x.expires);
    dd.classList.add(level(n));
    const label = n === 0 ? "D-day" : n > 0 ? "D-" + n : "D+" + (-n);
    dd.append(el("b", label.length >= 6 ? "xlong" : label.length >= 5 ? "long" : "", label), el("small", "", n < 0 ? "지남" : n === 0 ? "오늘까지" : "남음"));
  }
  const info = el("div", "info");
  const nm = el("div", "name", x.name);
  if (x.status === "active" && (x.qty || 1) > 1) nm.append(el("span", "qty", x.qty + "개"));
  let metaText;
  const loc = x.storage ? x.storage + " · " : "";
  if (x.status !== "active") metaText = loc + kdate(x.closedAt) + (x.closedByName ? " · " + x.closedByName : "");
  else if (stored) metaText = loc + fmtShort(x.storedOn) + " 넣음" + (x.addedByName ? " · " + x.addedByName : "");
  else metaText = loc + fmtShort(x.expires) + "까지" + (x.addedByName ? " · " + x.addedByName : "");
  info.append(nm, el("div", "meta", metaText));
  if (x.status === "active" && x.openedOn) {
    const o = sinceDays(x.openedOn);
    info.append(el("div", "meta opened", o <= 0 ? "오늘 개봉" : "개봉 " + (o + 1) + "일째"));
  }
  if (x.memo) info.append(el("div", "memo", x.memo));
  card.append(dd, info);

  if (!usingSamples) {
    const acts = el("div", "acts");
    if (x.status === "active") {
      const multi = (x.qty || 1) > 1;
      const eat = el("button", "act eat", multi ? S.usedOne : S.used);
      const toss = el("button", "act toss", multi ? "1개 버림" : "버림");
      const edit = el("button", "act edit", "수정");
      eat.type = toss.type = edit.type = "button";
      eat.onclick = () => consumeOne(x, "eaten");
      toss.onclick = () => consumeOne(x, "tossed");
      edit.onclick = () => { closeSheet(); openForm(x); };
      acts.append(eat, toss, edit);
    } else {
      const u = el("button", "act undo", "되돌리기");
      u.type = "button"; u.onclick = () => undo(x);
      acts.append(u);
    }
    card.append(acts);
  }
  return card;
}

function render() {
  const S = SECTIONS[section];
  const mine = items.filter((x) => catOf(x) === section);
  const usingSamples = !itemsCol || mine.length === 0;
  const source = usingSamples ? SAMPLES.filter((x) => x.category === section) : mine;
  const pool = source.filter((x) => x.status === "active");
  setVis("sampleNote", usingSamples && !!me);
  const qv = ($("q").value || "").trim().toLowerCase();
  const hit = (x) => !qv || [x.name, x.storage, x.memo, x.addedByName].some((v) => v && String(v).toLowerCase().includes(qv));

  const dated = pool.filter((x) => modeOf(x) === "expiry");
  const counts = { bad: 0, warn: 0, ok: 0 };
  dated.forEach((x) => counts[level(daysLeft(x.expires))]++);
  ["bad", "warn", "ok"].forEach((k) => { $("n-" + k).firstChild.nodeValue = counts[k]; });
  if (sheetLevel) fillSheet();

  const list = $("list");
  list.textContent = "";

  if (filterPlace === "done") {
    const rows = mine.filter((x) => x.status !== "active" && hit(x)).sort((a, b) => (b.closedAt || 0) - (a.closedAt || 0)).slice(0, 60);
    if (!rows.length) { emptyCard(list, "아직 처리한 기록이 없어요", "‘" + S.used + "’이나 ‘버림’을 누르면 여기에 쌓여요."); }
    else { const g = el("div", "group"); rows.forEach((x) => g.append(itemCard(x, false))); list.append(g); }
    return monthly(mine, S);
  }

  const inPlace = (x) => (filterPlace === "all" || x.storage === filterPlace) && hit(x);
  const expRows = dated.filter(inPlace)
    .filter((x) => !filterLevel || level(daysLeft(x.expires)) === filterLevel)
    .sort((a, b) => a.expires.localeCompare(b.expires));
  const storedRows = filterLevel ? [] : pool.filter((x) => modeOf(x) === "stored").filter(inPlace)
    .sort((a, b) => a.storedOn.localeCompare(b.storedOn));

  if (!expRows.length && !storedRows.length) emptyCard(list, qv ? "‘" + $("q").value.trim() + "’ 검색 결과가 없어요" : "해당하는 항목이 없어요", qv ? "다른 말로 찾아보거나, 위치 필터를 ‘전체’로 바꿔 보세요." : S.empty);
  const titles = { bad: "기한 지남", warn: "3일 이내", ok: "여유 있음" };
  ["bad", "warn", "ok"].forEach((k) => {
    const part = expRows.filter((x) => level(daysLeft(x.expires)) === k);
    if (part.length) group(list, titles[k], k, part, usingSamples);
  });
  if (storedRows.length) group(list, "넣은 날짜로 관리", "", storedRows, usingSamples, "오래된 것부터");
  monthly(mine, S);
}
function group(list, title, cls, rows, usingSamples, extra) {
  const g = el("div", "group");
  const h = el("div", "group-h " + cls);
  h.append(el("h3", "", title), el("span", "", rows.length + "개" + (extra ? " · " + extra : "")));
  g.append(h);
  rows.forEach((x) => g.append(itemCard(x, usingSamples)));
  list.append(g);
}
function emptyCard(list, title, msg) {
  const e = el("div", "card empty");
  e.append(el("b", "", title), msg);
  list.append(e);
}
function monthly(mine, S) {
  const now = new Date();
  const mStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  $("monthTitle").textContent = (now.getMonth() + 1) + "월 " + S.label + " 기록";
  const closed = mine.filter((x) => x.status !== "active" && (x.closedAt || 0) >= mStart);
  const e = closed.filter((x) => x.status === "eaten").reduce((s, x) => s + (x.qty || 1), 0);
  const tt = closed.filter((x) => x.status === "tossed").reduce((s, x) => s + (x.qty || 1), 0);
  const total = e + tt;
  $("nE").textContent = e; $("nT").textContent = tt;
  $("rate").textContent = total ? Math.round((tt / total) * 100) + "%" : "–";
  $("barE").style.width = total ? (e / total) * 100 + "%" : "0";
  $("barT").style.width = total ? (tt / total) * 100 + "%" : "0";
}

});

const tb = $("topbar");
addEventListener("scroll", () => tb.classList.toggle("scrolled", scrollY > 4), { passive: true });

buildForm();
render();
setInterval(() => { render(); showWhen(); }, 60 * 60 * 1000);
</script>
</body>
</html>
