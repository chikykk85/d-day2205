<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>냉장고 D-day</title>
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냉장고 D-day">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 모바일 앱 한 화면. 상단 고정 바 → 요약 3칸 → 추가 카드 → 필터 → 상태별로 묶인 목록 → 이번 달 기록 */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --ink: #111820;
  --ink-2: #3d4854;
  --muted: #6b7684;
  --line: #e3e7ec;
  --accent: #2f5bea;
  --accent-soft: #e8eefe;
  --accent-ink: #ffffff;
  --ok: #138a52;  --ok-soft: #e3f5eb;
  --warn: #c2650a; --warn-soft: #fdf0e1;
  --bad: #d93025; --bad-soft: #fde8e6;
  --shadow: 0 1px 2px rgba(17,24,32,.04), 0 4px 16px rgba(17,24,32,.05);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1318; --surface: #181d24; --surface-2: #1f252d; --ink: #eef1f4; --ink-2: #c3cad2; --muted: #8f99a5; --line: #2a313a;
    --accent: #7c9bff; --accent-soft: #1d2747; --accent-ink: #0c1330;
    --ok: #4fd18d; --ok-soft: #14301f; --warn: #f2a54a; --warn-soft: #362712; --bad: #ff7a70; --bad-soft: #3a1b18;
    --shadow: none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }

/* 상단 바 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-in { max-width: 680px; margin: 0 auto; padding-block: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: grid; gap: 0; }
.brand small { font-size: 14px; color: var(--muted); font-weight: 500; }
.brand h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
.me { display: flex; align-items: center; gap: 8px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 16px; }
.textbtn { background: none; border: 0; color: var(--muted); font-size: 15px; font-weight: 600; padding: 8px 4px; cursor: pointer; }

main { max-width: 680px; margin: 0 auto; padding-block: 8px 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); }
@media (prefers-color-scheme: light) { .card { border-color: transparent; } }
h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }

/* 요약 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 2px solid transparent; border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 14px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.stat .lbl { font-size: 15px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.stat .lbl i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.stat b { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -0.03em; }
.stat b span { font-size: 17px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.stat.bad i { background: var(--bad); } .stat.bad b { color: var(--bad); }
.stat.warn i { background: var(--warn); } .stat.warn b { color: var(--warn); }
.stat.ok i { background: var(--ok); } .stat.ok b { color: var(--ink); }
.stat[aria-pressed="true"] { border-color: var(--ink); }

/* 로그인 */
.login { padding: 24px 20px; display: grid; gap: 18px; }
.login p { margin: 0; color: var(--muted); font-size: 15px; }
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person { border: 2px solid var(--line); background: var(--surface-2); border-radius: 16px; padding: 18px 12px; cursor: pointer; display: grid; justify-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
.person .avatar { width: 52px; height: 52px; font-size: 22px; }
.person[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* 입력 */
.add { padding: 20px; display: grid; gap: 18px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field > span { font-size: 15px; font-weight: 700; color: var(--ink-2); }
input[type="text"], input[type="password"], input[type="date"] {
  font: inherit; font-size: 18px; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; height: 54px; padding: 0 16px; width: 100%; min-width: 0; appearance: none; -webkit-appearance: none;
}
input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
input::placeholder { color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; height: 54px; }
.seg button { border: 0; background: none; border-radius: 10px; font-size: 17px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.stepper { display: flex; align-items: center; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 14px; height: 54px; }
.stepper button { width: 48px; height: 100%; border: 0; background: none; font-size: 24px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.stepper output { min-width: 32px; text-align: center; font-size: 19px; font-weight: 700; }
.datebox { display: grid; gap: 10px; }
.when { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.when strong { font-size: 19px; font-weight: 800; }
.when em { font-style: normal; font-size: 16px; font-weight: 700; color: var(--accent); }
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.qbtn { height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700; cursor: pointer; color: var(--ink); }
.qbtn:active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qrow span { font-size: 14px; color: var(--muted); }
.reset { background: none; border: 0; color: var(--accent); font-size: 15px; font-weight: 700; cursor: pointer; padding: 6px 2px; }
.primary { height: 56px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 18px; font-weight: 800; cursor: pointer; width: 100%; }
.primary:active { filter: brightness(.94); }
.err { margin: 0; color: var(--bad); font-size: 15px; font-weight: 600; }

/* 필터 */
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(20px, env(safe-area-inset-left, 0px))); padding: 2px max(20px, env(safe-area-inset-left, 0px)); }
.filters::-webkit-scrollbar { display: none; }
.pill { flex: none; height: 42px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pill .n { margin-left: 4px; opacity: .6; }

/* 목록 */
.group { display: grid; gap: 10px; }
.group-h { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; }
.group-h h3 { margin: 0; font-size: 17px; font-weight: 800; }
.group-h span { font-size: 15px; color: var(--muted); font-weight: 600; }
.group-h.bad h3 { color: var(--bad); } .group-h.warn h3 { color: var(--warn); }
.note { margin: 0; padding: 12px 16px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 600; }
.item { padding: 14px 14px 14px 14px; display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center; }
.dday { height: 72px; border-radius: 14px; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.dday b { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.dday small { font-size: 13px; font-weight: 700; margin-top: 3px; }
.dday.ok { background: var(--ok-soft); color: var(--ok); }
.dday.warn { background: var(--warn-soft); color: var(--warn); }
.dday.bad { background: var(--bad-soft); color: var(--bad); }
.dday.gray { background: var(--surface-2); color: var(--muted); }
.info { min-width: 0; display: grid; gap: 4px; }
.name { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qty { font-size: 15px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; }
.meta { font-size: 15px; color: var(--muted); font-weight: 500; }
.acts { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.act { height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 700; cursor: pointer; padding: 0 14px; }
.act.eat { color: var(--ok); }
.act.toss { color: var(--bad); }
.act.del { color: var(--muted); }
.act.del.confirm { background: var(--bad); border-color: var(--bad); color: #fff; }
.act.undo { color: var(--accent); grid-column: 1 / -1; }
@media (min-width: 560px) {
  .item { grid-template-columns: 72px 1fr auto; }
  .acts { grid-column: auto; grid-template-columns: auto auto auto; }
  .act.undo { grid-column: auto; }
}
.empty { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 16px; }
.empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

/* 이번 달 기록 */
.month { padding: 20px; display: grid; gap: 14px; }
.month-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.month-top .rate { font-size: 15px; color: var(--muted); font-weight: 600; }
.month-top .rate b { font-size: 26px; color: var(--ink); font-weight: 800; margin-left: 4px; }
.bar { height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .4s; }
.bar .e { background: var(--ok); } .bar .t { background: var(--bad); }
.legend { display: flex; gap: 20px; font-size: 16px; color: var(--ink-2); font-weight: 600; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend b { font-weight: 800; }
footer { text-align: center; font-size: 14px; color: var(--muted); }

@media (max-width: 380px) {
  .quick { grid-template-columns: repeat(3, 1fr); }
  .stat b { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-in">
    <div class="brand"><small id="today"></small><h1>우리집 냉장고</h1></div>
    <div class="me" id="meBox" hidden>
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <button class="textbtn" id="logoutBtn" type="button">로그아웃</button>
    </div>
  </div>
</header>

<main>
  <!-- 로그인 -->
  <form class="card login" id="loginPanel" hidden novalidate>
    <h2>누구세요?</h2>
    <div class="people" role="group" aria-label="사용자 선택">
      <button type="button" class="person" data-who="jju" aria-pressed="true"><span class="avatar">쭈</span>쭈와와</button>
      <button type="button" class="person" data-who="ae" aria-pressed="false"><span class="avatar">애</span>애와와</button>
    </div>
    <label class="field"><span>비밀번호</span><input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="숫자 4자리"></label>
    <button class="primary" type="submit">들어가기</button>
    <p class="err" id="loginErr" hidden></p>
    <p>한 번 들어가면 이 기기에서는 다음부터 바로 열려요.</p>
  </form>

  <!-- 요약 -->
  <div class="stats" role="group" aria-label="상태별 개수">
    <button class="stat bad" data-f="bad" aria-pressed="false"><span class="lbl"><i></i>기한 지남</span><b id="n-bad">0<span>개</span></b></button>
    <button class="stat warn" data-f="warn" aria-pressed="false"><span class="lbl"><i></i>3일 이내</span><b id="n-warn">0<span>개</span></b></button>
    <button class="stat ok" data-f="ok" aria-pressed="false"><span class="lbl"><i></i>여유</span><b id="n-ok">0<span>개</span></b></button>
  </div>

  <!-- 추가 -->
  <form class="card add" id="addForm" novalidate>
    <h2>식품 추가</h2>
    <label class="field"><span>이름</span><input type="text" id="fName" placeholder="예: 우유 1L" autocomplete="off" enterkeyhint="done"></label>
    <div class="two">
      <div class="field"><span>보관</span>
        <div class="seg" id="storageSeg" role="group" aria-label="보관 장소">
          <button type="button" data-v="냉장" aria-pressed="true">냉장</button>
          <button type="button" data-v="냉동" aria-pressed="false">냉동</button>
          <button type="button" data-v="실온" aria-pressed="false">실온</button>
        </div>
      </div>
      <div class="field"><span>수량</span>
        <div class="stepper"><button type="button" id="qMinus" aria-label="수량 줄이기">−</button><output id="qOut">1</output><button type="button" id="qPlus" aria-label="수량 늘리기">+</button></div>
      </div>
    </div>
    <div class="field datebox"><span>소비기한 · 유통기한</span>
      <div class="when"><strong id="whenDate"></strong><em id="whenLeft"></em></div>
      <input type="date" id="fDate" aria-label="기한 날짜 직접 고르기">
      <div class="qrow"><span>누를 때마다 더해져요</span><button type="button" class="reset" id="resetDate">오늘로 되돌리기</button></div>
      <div class="quick">
        <button type="button" class="qbtn" data-d="1">+1일</button>
        <button type="button" class="qbtn" data-d="3">+3일</button>
        <button type="button" class="qbtn" data-d="7">+7일</button>
        <button type="button" class="qbtn" data-m="1">+1개월</button>
        <button type="button" class="qbtn" data-m="3">+3개월</button>
      </div>
    </div>
    <p class="err" id="err" hidden></p>
    <button class="primary" type="submit">추가하기</button>
  </form>

  <!-- 필터 -->
  <div class="filters" role="group" aria-label="보기">
    <button class="pill" data-s="all" aria-pressed="true">전체</button>
    <button class="pill" data-s="냉장" aria-pressed="false">냉장</button>
    <button class="pill" data-s="냉동" aria-pressed="false">냉동</button>
    <button class="pill" data-s="실온" aria-pressed="false">실온</button>
    <button class="pill" data-s="done" aria-pressed="false">처리 기록</button>
  </div>

  <p class="note" id="sampleNote" hidden>아래는 예시예요. 첫 식품을 추가하면 사라집니다.</p>
  <div id="list" style="display:grid;gap:22px"></div>

  <!-- 이번 달 -->
  <section class="card month" aria-label="이번 달 기록">
    <div class="month-top"><h2 id="monthTitle">이번 달</h2><span class="rate">버린 비율<b id="rate">–</b></span></div>
    <div class="bar"><i class="e" id="barE" style="width:0"></i><i class="t" id="barT" style="width:0"></i></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>먹음 <b id="nE">0</b>개</span><span><i style="background:var(--bad)"></i>버림 <b id="nT">0</b>개</span></div>
  </section>

  <footer id="saveInfo"></footer>
</main>

const DAY = 86400000;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

const addDays = (n) => ymd(new Date(startOfToday().getTime() + n * DAY));
const setVis = (id, on) => { $(id).hidden = !on; };

const t = startOfToday();

const SAMPLES = [
  { id: "x1", name: "두부", storage: "냉장", expires: addDays(-1), qty: 1, status: "active", addedByName: "예시" },

  { id: "x3", name: "계란 10구", storage: "냉장", expires: addDays(9), qty: 1, status: "active", addedByName: "예시" },
  { id: "x4", name: "냉동 만두", storage: "냉동", expires: addDays(80), qty: 2, status: "active", addedByName: "예시" },
];

let items = [];
let filterLevel = null;
let filterStorage = "all";
let me = null;
let itemsCol = null;
let unsubItems = null;
let pick = "jju";
let storage = "냉장";
let qty = 1;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app); // 로그인 상태는 기기에 저장되어 다음에도 유지됩니다.
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const nameOf = (email) => (Object.values(USERS).find((u) => u.email === email) || {}).name || (email || "").split("@")[0];
const myName = () => (me ? nameOf(me.email) : "누군가");

onAuthStateChanged(auth, (user) => {
  if (unsubItems) { unsubItems(); unsubItems = null; }
  me = user; items = []; itemsCol = null;
  if (!user) {
    setVis("meBox", false); setVis("loginPanel", true);
    $("saveInfo").textContent = "";
    render();
    return;
  }
  setVis("loginPanel", false); setVis("meBox", true);
  $("avatar").textContent = myName().slice(0, 1);
  $("avatar").title = myName();
  itemsCol = collection(db, "fridges", "home", "items");
  unsubItems = onSnapshot(itemsCol, (snap) => {
    items = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    render();
  }, (e) => { $("saveInfo").textContent = "목록을 불러오지 못했어요 (" + e.code + ")"; });
  $("saveInfo").textContent = myName() + " 님으로 로그인됨 · 쭈와와와 애와와가 함께 봐요";
  render();
});

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const body = (it) => { const b = Object.assign({}, it); delete b.id; return b; };
const save = (it) => setDoc(doc(itemsCol, it.id), body(it));
const remove = (id) => deleteDoc(doc(itemsCol, id));
function showErr(msg) { $("err").textContent = msg; setVis("err", true); }

// 먹음/버림: 1개씩 처리. 2개 이상이면 수량만 하나 줄이고 기록을 따로 남깁니다.
function consumeOne(x, status) {
  const stamp = { status, qty: 1, closedAt: Date.now(), closedByName: myName() };
  if ((x.qty || 1) <= 1) return save(Object.assign({}, x, stamp));
  const batch = writeBatch(db);
  batch.update(doc(itemsCol, x.id), { qty: increment(-1) });
  const rec = Object.assign({}, body(x), stamp, { sourceId: x.id });
  batch.set(doc(itemsCol, newId()), rec);
  return batch.commit();
}
// 되돌리기: 원래 묶음이 남아 있으면 수량을 하나 늘리고, 없으면 기록을 다시 살립니다.
function undo(x) {
  const src = x.sourceId && items.find((i) => i.id === x.sourceId && i.status === "active");
  if (src) {
    const batch = writeBatch(db);
    batch.update(doc(itemsCol, src.id), { qty: increment(1) });
    batch.delete(doc(itemsCol, x.id));
    return batch.commit();
  }
  return save(Object.assign({}, x, { status: "active", closedAt: null, closedByName: null }));
}

// ---- 날짜 입력 (누적) ----
function setDate(s) { $("fDate").value = s; showWhen(); }
function showWhen() {
  const v = $("fDate").value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { $("whenDate").textContent = "날짜를 고르세요"; $("whenLeft").textContent = ""; return; }
  const n = daysLeft(v);
  $("whenDate").textContent = fmtShort(v);
  $("whenLeft").textContent = n === 0 ? "오늘까지" : n > 0 ? n + "일 뒤" : (-n) + "일 지남";
}
function bump(days, months) {
  const cur = /^\d{4}-\d{2}-\d{2}$/.test($("fDate").value) ? parse($("fDate").value) : startOfToday();
  if (months) {
    const day = cur.getDate();
    cur.setDate(1); cur.setMonth(cur.getMonth() + months);
    const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
    cur.setDate(Math.min(day, last));
  } else cur.setDate(cur.getDate() + days);
  setDate(ymd(cur));
}
setDate(addDays(0));

// ---- 화면 그리기 ----
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function itemCard(x, usingSamples) {
  const card = el("div", "card item");
  const n = daysLeft(x.expires);
  const dd = el("div", "dday");
  if (x.status === "active") {
    dd.classList.add(level(n));
    dd.append(el("b", "", n === 0 ? "D-day" : n > 0 ? "D-" + n : "D+" + (-n)), el("small", "", n < 0 ? "지남" : n === 0 ? "오늘까지" : "남음"));
  } else {
    dd.classList.add(x.status === "eaten" ? "ok" : "bad");
    dd.append(el("b", "", x.status === "eaten" ? "먹음" : "버림"));
  }
  const info = el("div", "info");
  const nm = el("div", "name", x.name);
  if (x.status === "active" && (x.qty || 1) > 1) nm.append(el("span", "qty", x.qty + "개"));
  const who = x.status === "active"
    ? (x.addedByName ? " · " + x.addedByName : "")
    : (x.closedByName ? " · " + x.closedByName : "");
  const metaText = x.status === "active"
    ? x.storage + " · " + fmtShort(x.expires) + "까지" + who
    : x.storage + " · " + new Date(x.closedAt || 0).toLocaleDateString("ko-KR", { month: "long", day: "numeric" }) + who;
  info.append(nm, el("div", "meta", metaText));
  card.append(dd, info);

  if (!usingSamples) {
    const acts = el("div", "acts");
    if (x.status === "active") {
      const multi = (x.qty || 1) > 1;
      const eat = el("button", "act eat", multi ? "1개 먹음" : "먹음");
      const toss = el("button", "act toss", multi ? "1개 버림" : "버림");
      const del = el("button", "act del", "삭제");
      eat.type = toss.type = del.type = "button";
      eat.onclick = () => consumeOne(x, "eaten");
      toss.onclick = () => consumeOne(x, "tossed");
      let armed = false;
      del.onclick = () => {
        if (armed) { remove(x.id); return; }
        armed = true; del.classList.add("confirm"); del.textContent = "정말 삭제";
        setTimeout(() => { armed = false; del.classList.remove("confirm"); del.textContent = "삭제"; }, 3000);
      };
      acts.append(eat, toss, del);
    } else {
      const u = el("button", "act undo", "되돌리기");
      u.type = "button"; u.onclick = () => undo(x);
      acts.append(u);
    }
    card.append(acts);
  }
  return card;
}

function render() {
  const usingSamples = !itemsCol || items.length === 0;
  const pool = usingSamples ? SAMPLES : items.filter((x) => x.status === "active");
  setVis("sampleNote", usingSamples && !!me);

  const counts = { bad: 0, warn: 0, ok: 0 };
  pool.forEach((x) => counts[level(daysLeft(x.expires))]++);
  ["bad", "warn", "ok"].forEach((k) => { $("n-" + k).firstChild.nodeValue = counts[k]; });
  document.querySelectorAll(".stat").forEach((s) => s.setAttribute("aria-pressed", String(filterLevel === s.dataset.f)));

  const list = $("list");
  list.textContent = "";

  if (filterStorage === "done") {
    const rows = items.filter((x) => x.status !== "active").sort((a, b) => (b.closedAt || 0) - (a.closedAt || 0)).slice(0, 60);
    if (!rows.length) return finish(list, "아직 처리한 식품이 없어요", "‘먹음’이나 ‘버림’을 누르면 여기에 쌓여요.");
    const g = el("div", "group");
    rows.forEach((x) => g.append(itemCard(x, false)));
    list.append(g);
  } else {
    const rows = pool
      .filter((x) => filterStorage === "all" || x.storage === filterStorage)
      .filter((x) => !filterLevel || level(daysLeft(x.expires)) === filterLevel)
      .sort((a, b) => a.expires.localeCompare(b.expires));
    if (!rows.length) finish(list, "해당하는 식품이 없어요", "위에서 이름과 기한을 넣고 추가하세요.");
    const titles = { bad: "기한 지남", warn: "3일 이내", ok: "여유 있음" };
    ["bad", "warn", "ok"].forEach((k) => {
      const part = rows.filter((x) => level(daysLeft(x.expires)) === k);
      if (!part.length) return;
      const g = el("div", "group");
      const h = el("div", "group-h " + k);
      h.append(el("h3", "", titles[k]), el("span", "", part.length + "개"));
      g.append(h);
      part.forEach((x) => g.append(itemCard(x, usingSamples)));
      list.append(g);
    });
  }
  monthly();
}
function finish(list, title, msg) {
  const e = el("div", "card empty");
  e.append(el("b", "", title), msg);
  list.append(e);
  monthly();
}
function monthly() {
  const now = new Date();
  const mStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  $("monthTitle").textContent = (now.getMonth() + 1) + "월 기록";
  const closed = items.filter((x) => x.status !== "active" && (x.closedAt || 0) >= mStart);
  const e = closed.filter((x) => x.status === "eaten").reduce((s, x) => s + (x.qty || 1), 0);
  const tt = closed.filter((x) => x.status === "tossed").reduce((s, x) => s + (x.qty || 1), 0);
  const total = e + tt;
  $("nE").textContent = e; $("nT").textContent = tt;
  $("rate").textContent = total ? Math.round((tt / total) * 100) + "%" : "–";
  $("barE").style.width = total ? (e / total) * 100 + "%" : "0";
  $("barT").style.width = total ? (tt / total) * 100 + "%" : "0";
}

// ---- 이벤트 ----
document.querySelectorAll(".person").forEach((w) => w.addEventListener("click", () => {
  pick = w.dataset.who;
  document.querySelectorAll(".person").forEach((x) => x.setAttribute("aria-pressed", String(x === w)));
  $("pw").focus();
}));
$("loginPanel").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pw = $("pw").value.trim();
  if (!pw) { $("loginErr").textContent = "비밀번호를 입력하세요."; setVis("loginErr", true); return; }
  setVis("loginErr", false);
  try { await signInWithEmailAndPassword(auth, USERS[pick].email, pw + PW_SUFFIX); $("pw").value = ""; }
  catch (e) {
    const wrong = ["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-login-credentials"].includes(e.code);
    $("loginErr").textContent = wrong ? "비밀번호가 맞지 않아요." : e.code === "auth/too-many-requests" ? "여러 번 틀려서 잠시 막혔어요. 몇 분 뒤 다시 해 보세요." : "들어가지 못했어요 (" + e.code + ")";
    setVis("loginErr", true);
  }
});
$("logoutBtn").addEventListener("click", () => signOut(auth));

document.querySelectorAll("#storageSeg button").forEach((b) => b.addEventListener("click", () => {
  storage = b.dataset.v;
  document.querySelectorAll("#storageSeg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
}));
const setQty = (n) => { qty = Math.max(1, Math.min(99, n)); $("qOut").textContent = qty; };
$("qMinus").addEventListener("click", () => setQty(qty - 1));
$("qPlus").addEventListener("click", () => setQty(qty + 1));
document.querySelectorAll(".qbtn").forEach((b) => b.addEventListener("click", () => bump(Number(b.dataset.d || 0), Number(b.dataset.m || 0))));
$("resetDate").addEventListener("click", () => setDate(addDays(0)));
$("fDate").addEventListener("change", showWhen);

document.querySelectorAll(".stat").forEach((s) => s.addEventListener("click", () => {
  filterLevel = filterLevel === s.dataset.f ? null : s.dataset.f;
  if (filterStorage === "done") setStorage("all");
  render();
}));
function setStorage(v) {
  filterStorage = v;
  document.querySelectorAll(".pill").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.s === v)));
}
document.querySelectorAll(".pill").forEach((c) => c.addEventListener("click", () => {
  setStorage(c.dataset.s);
  if (c.dataset.s === "done") filterLevel = null;
  render();
}));

$("addForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const name = $("fName").value.trim();
  const date = $("fDate").value;
  if (!me || !itemsCol) { showErr("먼저 로그인하세요."); return; }
  if (!name) { showErr("식품 이름을 입력하세요."); $("fName").focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showErr("기한 날짜를 고르세요."); return; }
  setVis("err", false);
  const item = { id: newId(), name, storage, expires: date, qty, status: "active", addedAt: Date.now(), addedByName: myName(), closedAt: null, closedByName: null };
  save(item).catch((e) => showErr("저장하지 못했어요 (" + e.code + ")"));
  $("fName").value = ""; setQty(1); setDate(addDays(0));
  $("fName").blur();
});

const tb = $("topbar");
addEventListener("scroll", () => tb.classList.toggle("scrolled", scrollY > 4), { passive: true });

render();
setInterval(() => { render(); showWhen(); }, 60 * 60 * 1000);
</script>
</body>
</html>
