<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>냉장고 D-day</title>
<meta name="theme-color" content="#eef2f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, like a list taped to the fridge door. Summary strip on top, add form, then items sorted by days left. */
:root {
  --bg: #eef2f4;          /* frosted door */
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5d6b78;
  --line: #d6dee4;
  --accent: #2a4bd1;      /* marker-pen blue */
  --accent-ink: #ffffff;
  --ok: #1f8a5a;  --ok-bg: #e2f3ea;
  --warn: #b36a00; --warn-bg: #fdf0d9;
  --bad: #c2362b; --bad-bg: #fbe3e0;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --surface: #1a222a; --ink: #e6edf2; --muted: #93a2ae; --line: #2a3540;
  --accent: #7d95ff; --accent-ink: #0d1322;
  --ok: #5fcf96; --ok-bg: #173226; --warn: #f0b04f; --warn-bg: #3a2c12; --bad: #ff7d71; --bad-bg: #3d1d1a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #1a222a; --ink: #e6edf2; --muted: #93a2ae; --line: #2a3540;
  --accent: #7d95ff; --accent-ink: #0d1322;
  --ok: #5fcf96; --ok-bg: #173226; --warn: #f0b04f; --warn-bg: #3a2c12; --bad: #ff7d71; --bad-bg: #3d1d1a;
  color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }

header { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1; margin: 0; letter-spacing: -0.5px; }
h1 span { color: var(--accent); }
.today { font-family: var(--font-num); color: var(--muted); font-size: 13px; }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 2px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.sum:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sum b { font-family: var(--font-num); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sum small { color: var(--muted); font-size: 12px; }
.sum.bad b { color: var(--bad); } .sum.warn b { color: var(--warn); } .sum.ok b { color: var(--ok); }
.sum[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

form.add { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { min-width: 0; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 120px; }
input, select { font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; box-sizing: border-box; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.quick span { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.primary { font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
.err { color: var(--bad); font-size: 13px; margin: 0; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.list { display: grid; gap: 8px; }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; margin: 0; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; align-items: center; }
.dday { font-family: var(--font-num); font-weight: 700; font-size: 18px; text-align: center; border-radius: 8px; padding: 8px 0; font-variant-numeric: tabular-nums; }
.dday small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 11px; }
.dday.ok { background: var(--ok-bg); color: var(--ok); }
.dday.warn { background: var(--warn-bg); color: var(--warn); }
.dday.bad { background: var(--bad-bg); color: var(--bad); }
.meta { min-width: 0; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.sub { font-size: 12px; color: var(--muted); font-family: var(--font-num); }
.sub .st { font-family: var(--font-body); }
.acts { display: flex; gap: 4px; }
.act { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; padding: 5px 8px; cursor: pointer; white-space: nowrap; }
.act.eat:hover { border-color: var(--ok); color: var(--ok); }
.act.toss:hover { border-color: var(--bad); color: var(--bad); }
.act.undo:hover { border-color: var(--accent); color: var(--accent); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

.waste { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.waste h2 { margin: 0; font-size: 14px; font-weight: 700; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .e { background: var(--ok); } .bar .t { background: var(--bad); }
.legend { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); flex-wrap: wrap; gap: 8px; }
.legend b { font-family: var(--font-num); color: var(--ink); }
footer { font-size: 12px; color: var(--muted); }

@media (max-width: 460px) {
  .item { grid-template-columns: 64px 1fr; }
  .acts { grid-column: 1 / -1; justify-content: flex-end; }
  h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: no-preference) { .item { transition: border-color .15s; } }
* { box-sizing: border-box; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
.account { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.account .who { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.account .who b { color: var(--ink); }
.ghost { font: inherit; font-size: 13px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.ghost:hover { border-color: var(--accent); color: var(--accent); }
</style>

<style>
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font-size: 16px; }
.panel p { margin: 0; color: var(--muted); font-size: 13px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.split > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
@media (max-width: 520px) { .split { grid-template-columns: 1fr; } }
.code { font-family: var(--font-num); font-size: 18px; letter-spacing: 2px; font-weight: 700; color: var(--accent); user-select: all; overflow-wrap: anywhere; }
.fridgebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.fridgebar .nm { font-weight: 700; font-size: 16px; }
.fridgebar .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.by { font-family: var(--font-body); }
.toast { font-size: 13px; color: var(--ok); margin: 0; }
.who-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>냉장고 <span>D-day</span></h1>
    <div class="today" id="today"></div>
  </header>

  <div class="account" id="account" hidden>
    <span class="who" id="who"></span>
    <button class="ghost" id="logoutBtn" type="button">로그아웃</button>
  </div>

  <form class="panel" id="loginPanel" hidden novalidate>
    <h2>누구세요?</h2>
    <div class="row" role="radiogroup" aria-label="사용자 선택">
      <button type="button" class="chip who-btn" data-who="jju" aria-pressed="true">쭈와와</button>
      <button type="button" class="chip who-btn" data-who="ae" aria-pressed="false">애와와</button>
    </div>
    <label class="f">비밀번호<input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="숫자 4자리"></label>
    <div><button class="primary" id="loginBtn" type="submit">들어가기</button></div>
    <p class="err" id="loginErr" hidden></p>
    <p>한 번 들어가면 이 기기에서는 다음부터 바로 열려요.</p>
  </form>

  <div class="summary" role="group" aria-label="상태별 개수">
    <button class="sum bad" id="s-bad" data-f="bad" aria-pressed="false"><b id="n-bad">0</b><small>기한 지남</small></button>
    <button class="sum warn" id="s-warn" data-f="warn" aria-pressed="false"><b id="n-warn">0</b><small>3일 이내</small></button>
    <button class="sum ok" id="s-ok" data-f="ok" aria-pressed="false"><b id="n-ok">0</b><small>여유 있음</small></button>
  </div>

  <form class="add" id="addForm" novalidate>
    <div class="row">
      <label class="f" style="flex:2 1 180px">식품 이름<input id="fName" placeholder="예: 우유 1L" autocomplete="off"></label>
      <label class="f" style="flex:0 1 110px">보관<select id="fStorage"><option>냉장</option><option>냉동</option><option>실온</option></select></label>
    </div>
    <div class="row">
      <label class="f">소비기한 / 유통기한<input type="date" id="fDate"></label>
      <label class="f" style="flex:0 1 90px">수량<input type="number" id="fQty" min="1" value="1" inputmode="numeric"></label>
    </div>
    <div class="quick"><span>오늘부터</span>
      <button type="button" class="chip" data-d="3">+3일</button>
      <button type="button" class="chip" data-d="7">+7일</button>
      <button type="button" class="chip" data-d="14">+2주</button>
      <button type="button" class="chip" data-d="30">+1개월</button>
      <button type="button" class="chip" data-d="90">+3개월</button>
    </div>
    <p class="err" id="err" hidden></p>
    <div><button class="primary" type="submit">추가하기</button></div>
  </form>

  <div class="tabs" role="group" aria-label="보관 장소">
    <button class="chip" data-s="all" aria-pressed="true">전체</button>
    <button class="chip" data-s="냉장" aria-pressed="false">냉장</button>
    <button class="chip" data-s="냉동" aria-pressed="false">냉동</button>
    <button class="chip" data-s="실온" aria-pressed="false">실온</button>
    <button class="chip" data-s="done" aria-pressed="false">처리 기록</button>
  </div>

  <p class="note" id="sampleNote" hidden>아래는 예시입니다. 로그인하고 첫 식품을 추가하면 사라집니다.</p>
  <div class="list" id="list"></div>

  <section class="waste" aria-label="이번 달 기록">
    <h2 id="wasteTitle">이번 달</h2>
    <div class="bar"><i class="e" id="barE" style="width:0"></i><i class="t" id="barT" style="width:0"></i></div>
    <div class="legend"><span>먹음 <b id="nE">0</b>개</span><span>버림 <b id="nT">0</b>개</span><span>버린 비율 <b id="rate">–</b></span></div>
  </section>

  <footer id="saveInfo"></footer>
</div>

<script type="module">
// ============================================================
// Firebase 설정값 (프로젝트: d-day2205)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCbw1bedXgKUKZSSRpyO9LTKChebpA2P80",
  authDomain: "d-day2205.firebaseapp.com",
  projectId: "d-day2205",
  storageBucket: "d-day2205.firebasestorage.app",
  messagingSenderId: "155046611403",
  appId: "1:155046611403:web:3ff54d92c42e6ddfee4e4e",
};
// ============================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 사용자 목록: Firebase Authentication에 만든 이메일과 화면에 보일 이름
const USERS = {
  jju: { name: "쭈와와", email: "jju@d-day2205.app" },
  ae:  { name: "애와와", email: "ae@d-day2205.app" },
};
const PW_SUFFIX = "dday"; // Firebase 비밀번호는 6자 이상이어야 해서 입력값 뒤에 붙임 (0708 → 0708dday)

const DAY = 86400000;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const daysLeft = (s) => Math.round((parse(s) - startOfToday()) / DAY);
const level = (n) => n < 0 ? "bad" : n <= 3 ? "warn" : "ok";
const ddayText = (n) => n === 0 ? "D-day" : n > 0 ? "D-" + n : "D+" + (-n);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const fmt = (s) => { const d = parse(s); return (d.getMonth() + 1) + "." + d.getDate() + " (" + WD[d.getDay()] + ")"; };
const addDays = (n) => ymd(new Date(startOfToday().getTime() + n * DAY));

const t = startOfToday();
$("today").textContent = "오늘 " + ymd(t).replace(/-/g, ".") + " " + WD[t.getDay()];
$("fDate").value = addDays(7);

const SAMPLES = [
  { id: "x1", name: "두부", storage: "냉장", expires: addDays(-1), qty: 1, status: "active", addedByName: "예시" },
  { id: "x2", name: "우유 1L", storage: "냉장", expires: addDays(2), qty: 1, status: "active", addedByName: "예시" },
  { id: "x3", name: "계란 10구", storage: "냉장", expires: addDays(9), qty: 1, status: "active", addedByName: "예시" },
  { id: "x4", name: "냉동 만두", storage: "냉동", expires: addDays(80), qty: 2, status: "active", addedByName: "예시" },
];

let items = [];
let filterLevel = null;
let filterStorage = "all";
let me = null;
let itemsCol = null;
let unsubItems = null;
let pick = "jju";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app); // 로그인 상태는 이 기기에 저장되어 다음에 자동으로 유지됩니다.
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const nameOf = (email) => (Object.values(USERS).find((u) => u.email === email) || {}).name || (email || "").split("@")[0];
const myName = () => (me ? nameOf(me.email) : "누군가");
const setVis = (id, on) => { $(id).hidden = !on; };

onAuthStateChanged(auth, (user) => {
  if (unsubItems) { unsubItems(); unsubItems = null; }
  me = user; items = []; itemsCol = null;
  if (!user) {
    setVis("account", false); setVis("loginPanel", true);
    $("saveInfo").textContent = "로그인 전에는 예시만 보여요.";
    render();
    return;
  }
  setVis("loginPanel", false); setVis("account", true);
  $("who").textContent = "";
  const b = document.createElement("b"); b.textContent = myName();
  $("who").append(b, " 님 · 우리집 냉장고");
  itemsCol = collection(db, "fridges", "home", "items");
  unsubItems = onSnapshot(itemsCol, (snap) => {
    items = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    render();
  }, (e) => { $("saveInfo").textContent = "목록을 불러오지 못했어요: " + e.code; });
  $("saveInfo").textContent = "쭈와와와 애와와에게 실시간으로 함께 보여요.";
  render();
});

function showErr(msg) { $("err").textContent = msg; setVis("err", true); }

const save = (it) => { const body = Object.assign({}, it); delete body.id; return setDoc(doc(itemsCol, it.id), body); };
const remove = (id) => deleteDoc(doc(itemsCol, id));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---- 화면 그리기 ----
function render() {
  const usingSamples = !itemsCol || items.length === 0;
  const pool = usingSamples ? SAMPLES : items.filter((x) => x.status === "active");
  setVis("sampleNote", usingSamples);

  const counts = { bad: 0, warn: 0, ok: 0 };
  pool.forEach((x) => counts[level(daysLeft(x.expires))]++);
  ["bad", "warn", "ok"].forEach((k) => { $("n-" + k).textContent = counts[k]; $("s-" + k).setAttribute("aria-pressed", String(filterLevel === k)); });

  const list = $("list");
  list.textContent = "";
  let rows;
  if (filterStorage === "done") {
    rows = items.filter((x) => x.status !== "active").sort((a, b) => (b.closedAt || 0) - (a.closedAt || 0)).slice(0, 50);
  } else {
    rows = pool
      .filter((x) => filterStorage === "all" || x.storage === filterStorage)
      .filter((x) => !filterLevel || level(daysLeft(x.expires)) === filterLevel)
      .sort((a, b) => a.expires.localeCompare(b.expires));
  }

  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "empty";
    const b = document.createElement("b");
    if (filterStorage === "done") { b.textContent = "아직 처리한 식품이 없어요"; e.append(b, "목록에서 ‘먹음’이나 ‘버림’을 누르면 여기에 쌓입니다."); }
    else { b.textContent = "해당하는 식품이 없어요"; e.append(b, "위 칸에 이름과 날짜를 넣고 추가하세요."); }
    list.append(e);
  }

  rows.forEach((x) => {
    const n = daysLeft(x.expires);
    const el = document.createElement("div");
    el.className = "item";
    const dd = document.createElement("div");
    if (x.status === "active") {
      dd.className = "dday " + level(n);
      dd.textContent = ddayText(n);
      const s = document.createElement("small");
      s.textContent = n < 0 ? "지남" : n === 0 ? "오늘까지" : "남음";
      dd.append(s);
    } else {
      dd.className = "dday " + (x.status === "eaten" ? "ok" : "bad");
      dd.textContent = x.status === "eaten" ? "먹음" : "버림";
    }
    const meta = document.createElement("div");
    meta.className = "meta";
    const nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = x.name + (x.qty > 1 ? " × " + x.qty : "");
    const sub = document.createElement("div");
    sub.className = "sub";
    const st = document.createElement("span");
    st.className = "st";
    st.textContent = x.storage + " · ";
    const by = document.createElement("span");
    by.className = "by";
    by.textContent = x.status === "active"
      ? (x.addedByName ? " · " + x.addedByName + " 추가" : "")
      : (x.closedByName ? " · " + x.closedByName + (x.status === "eaten" ? " 먹음" : " 버림") : "");
    sub.append(st, "기한 " + fmt(x.expires), by);
    meta.append(nm, sub);

    const acts = document.createElement("div");
    acts.className = "acts";
    if (!usingSamples) {
      if (x.status === "active") {
        acts.append(btn("먹음", "eat", () => close(x, "eaten")), btn("버림", "toss", () => close(x, "tossed")), btn("삭제", "", () => remove(x.id)));
      } else {
        acts.append(btn("되돌리기", "undo", () => save(Object.assign({}, x, { status: "active", closedAt: null, closedByName: null }))));
      }
    }
    el.append(dd, meta, acts);
    list.append(el);
  });

  const now = new Date();
  const mStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  $("wasteTitle").textContent = (now.getMonth() + 1) + "월 기록 ";
  const closed = items.filter((x) => x.status !== "active" && (x.closedAt || 0) >= mStart);
  const e = closed.filter((x) => x.status === "eaten").reduce((s, x) => s + (x.qty || 1), 0);
  const tt = closed.filter((x) => x.status === "tossed").reduce((s, x) => s + (x.qty || 1), 0);
  const total = e + tt;
  $("nE").textContent = e; $("nT").textContent = tt;
  $("rate").textContent = total ? Math.round((tt / total) * 100) + "%" : "–";
  $("barE").style.width = total ? (e / total) * 100 + "%" : "0";
  $("barT").style.width = total ? (tt / total) * 100 + "%" : "0";
}

function btn(label, cls, fn) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "act " + cls; b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}
function close(x, status) { save(Object.assign({}, x, { status, closedAt: Date.now(), closedByName: myName() })); }

// ---- 이벤트 ----
document.querySelectorAll(".who-btn").forEach((w) => w.addEventListener("click", () => {
  pick = w.dataset.who;
  document.querySelectorAll(".who-btn").forEach((x) => x.setAttribute("aria-pressed", String(x === w)));
  $("pw").focus();
}));
$("loginPanel").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pw = $("pw").value.trim();
  if (!pw) { $("loginErr").textContent = "비밀번호를 입력하세요."; setVis("loginErr", true); return; }
  setVis("loginErr", false);
  try { await signInWithEmailAndPassword(auth, USERS[pick].email, pw + PW_SUFFIX); $("pw").value = ""; }
  catch (e) {
    const wrong = ["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-login-credentials"].includes(e.code);
    $("loginErr").textContent = wrong ? "비밀번호가 맞지 않아요." : e.code === "auth/too-many-requests" ? "여러 번 틀려서 잠시 막혔어요. 몇 분 뒤 다시 해 보세요." : "들어가지 못했어요: " + e.code;
    setVis("loginErr", true);
  }
});
$("logoutBtn").addEventListener("click", () => signOut(auth));

document.querySelectorAll(".quick .chip").forEach((c) => c.addEventListener("click", () => { $("fDate").value = addDays(Number(c.dataset.d)); }));
document.querySelectorAll(".sum").forEach((s) => s.addEventListener("click", () => {
  filterLevel = filterLevel === s.dataset.f ? null : s.dataset.f;
  if (filterStorage === "done") setStorage("all");
  render();
}));
function setStorage(v) {
  filterStorage = v;
  document.querySelectorAll(".tabs .chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.s === v)));
}
document.querySelectorAll(".tabs .chip").forEach((c) => c.addEventListener("click", () => {
  setStorage(c.dataset.s);
  if (c.dataset.s === "done") filterLevel = null;
  render();
}));

$("addForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const name = $("fName").value.trim();
  const date = $("fDate").value;
  if (!me || !itemsCol) { showErr("먼저 로그인하세요."); return; }
    if (!name) { showErr("식품 이름을 입력하세요."); $("fName").focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showErr("기한 날짜를 고르세요. 아래 빠른 버튼을 써도 됩니다."); return; }
  setVis("err", false);
  const item = { id: newId(), name, storage: $("fStorage").value, expires: date, qty: Math.max(1, parseInt($("fQty").value, 10) || 1), status: "active", addedAt: Date.now(), addedByName: myName(), closedAt: null, closedByName: null };
  save(item).catch((e) => showErr("저장하지 못했어요: " + e.code));
  $("fName").value = ""; $("fQty").value = "1";
  $("fName").focus();
});

render();
setInterval(render, 60 * 60 * 1000);
</script>
</body>
</html>
